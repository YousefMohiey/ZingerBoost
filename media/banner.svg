<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background gradient - dark retro wave -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0015"/>
      <stop offset="40%" stop-color="#100525"/>
      <stop offset="80%" stop-color="#1a0a3e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Neon sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="72%" r="30%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ff3366" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ff0066" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon cyan gradient for text -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffc8"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <!-- Neon magenta gradient for accent -->
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00aa"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>

    <!-- Scan lines pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="1" stroke-opacity="0.15"/>
    </pattern>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#ff00aa" stroke-width="0.5" stroke-opacity="0.15"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#ff00aa" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CRT curvature clip -->
    <clipPath id="crt">
      <rect x="20" y="20" width="1160" height="360" rx="12"/>
    </clipPath>

    <!-- Scanline overlay -->
    <pattern id="scanlinesFine" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="transparent"/>
      <rect y="1" width="2" height="1" fill="#000" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Outer CRT frame -->
  <rect x="10" y="10" width="1180" height="380" rx="16" fill="#1a1a2e" stroke="#00ffc8" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="16" y="16" width="1168" height="368" rx="13" fill="none" stroke="#00ffc8" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Screen area -->
  <g clip-path="url(#crt)">
    <!-- Background -->
    <rect x="20" y="20" width="1160" height="360" fill="url(#bg)"/>

    <!-- Grid overlay -->
    <rect x="20" y="200" width="1160" height="180" fill="url(#grid)"/>

    <!-- Sun glow -->
    <rect x="20" y="20" width="1160" height="360" fill="url(#sunGlow)"/>

    <!-- Neon sun (retro wave signature) -->
    <line x1="20" y1="280" x2="1180" y2="280" stroke="#ff0066" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="20" y1="280" x2="1180" y2="280" stroke="#ff00aa" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Horizontal grid lines (closer together near bottom) -->
    <g stroke="#ff00aa" stroke-width="0.5" stroke-opacity="0.2">
      <line x1="20" y1="230" x2="1180" y2="230"/>
      <line x1="20" y1="260" x2="1180" y2="260"/>
      <line x1="20" y1="290" x2="1180" y2="290"/>
      <line x1="20" y1="320" x2="1180" y2="320"/>
      <line x1="20" y1="350" x2="1180" y2="350"/>
    </g>

    <!-- Vertical grid lines -->
    <g stroke="#ff00aa" stroke-width="0.5" stroke-opacity="0.15">
      <line x1="140" y1="230" x2="140" y2="380"/>
      <line x1="260" y1="230" x2="260" y2="380"/>
      <line x1="380" y1="230" x2="380" y2="380"/>
      <line x1="500" y1="230" x2="500" y2="380"/>
      <line x1="620" y1="230" x2="620" y2="380"/>
      <line x1="740" y1="230" x2="740" y2="380"/>
      <line x1="860" y1="230" x2="860" y2="380"/>
      <line x1="980" y1="230" x2="980" y2="380"/>
      <line x1="1100" y1="230" x2="1100" y2="380"/>
    </g>

    <!-- Main title - ZINGERBOOST -->
    <text x="600" y="140" font-family="'Courier New', monospace" font-size="72" font-weight="bold"
          fill="url(#neonCyan)" text-anchor="middle" filter="url(#glowStrong)" letter-spacing="12">
      ZINGERBOOST
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="'Courier New', monospace" font-size="16"
          fill="#ff00aa" text-anchor="middle" letter-spacing="6" filter="url(#glow)">
      WINDOWS OPTIMIZATION UTILITY
    </text>

    <!-- Retro terminal decorations -->
    <text x="80" y="225" font-family="'Courier New', monospace" font-size="11" fill="#00ffc8" opacity="0.5">
      C:\&gt; sysinit.exe --optimize --safe
    </text>
    <text x="80" y="245" font-family="'Courier New', monospace" font-size="11" fill="#00ffc8" opacity="0.4">
      [ OK ] Initializing 49 registered tweaks
    </text>
    <text x="80" y="265" font-family="'Courier New', monospace" font-size="11" fill="#00ffc8" opacity="0.35">
      [ OK ] Service controller: 19 services
    </text>
    <text x="80" y="285" font-family="'Courier New', monospace" font-size="11" fill="#00ffc8" opacity="0.3">
      [ OK ] Debloat engine: 44 packages
    </text>
    <text x="80" y="305" font-family="'Courier New', monospace" font-size="11" fill="#00ffc8" opacity="0.25">
      [ OK ] Winget catalog: 30+ applications
    </text>

    <!-- Bottom right version -->
    <text x="1130" y="365" font-family="'Courier New', monospace" font-size="14" fill="#00ffc8" text-anchor="end" opacity="0.6">
      v0.0.6 :: RUST + TAURI v2
    </text>

    <!-- Corner decorations -->
    <g stroke="#00ffc8" stroke-width="1" fill="none" opacity="0.4">
      <!-- Top-left corner -->
      <path d="M30 50 L30 30 L50 30"/>
      <!-- Top-right corner -->
      <path d="M1170 50 L1170 30 L1150 30"/>
      <!-- Bottom-left corner -->
      <path d="M30 350 L30 370 L50 370"/>
    </g>

    <!-- Cursor blink -->
    <rect x="355" y="222" width="8" height="14" fill="#00ffc8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Scan lines -->
    <rect x="20" y="20" width="1160" height="360" fill="url(#scanlinesFine)"/>
  </g>

  <!-- CRT inner shadow -->
  <rect x="20" y="20" width="1160" height="360" rx="12" fill="none" stroke="#000" stroke-width="6" opacity="0.3"/>
</svg>
