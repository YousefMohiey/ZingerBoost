name: zingerboost
description: Safe Windows Optimization Utility
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  intl: ^0.19.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  ffi: ^2.1.2
  window_manager: ^0.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
