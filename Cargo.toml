[workspace]
members = [
    "crates/zb_shared",
    "crates/zb_domain",
    "crates/zb_application",
    "crates/zb_infrastructure",
    "crates/zb_app",
]
resolver = "2"

[workspace.package]
version = "0.0.5"
authors = ["YousefMohiey <yousefmohiey@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/YousefMohiey/ZingerBoost"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
async-trait = "0.1"

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Restore",
    "Management_Deployment",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Services_Store",
] }

rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
rusqlite_migration = "1.3"

mockall = "0.13"

iced = { version = "0.13", features = ["tokio", "image"] }

zb_shared = { path = "crates/zb_shared" }
zb_domain = { path = "crates/zb_domain" }
zb_application = { path = "crates/zb_application" }
zb_infrastructure = { path = "crates/zb_infrastructure" }
