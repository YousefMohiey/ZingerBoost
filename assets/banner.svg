<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="700" cy="40" r="80" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="100" cy="160" r="60" fill="#22d3ee" opacity="0.06"/>
  
  <!-- Lightning bolt icon -->
  <g transform="translate(60, 50) scale(2.5)">
    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="url(#accent)" stroke="#0ea5e9" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="140" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1">ZingerBoost</text>
  <text x="142" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Safe · Reversible · Windows Optimization</text>
  
  <!-- Version badge -->
  <rect x="680" y="85" width="80" height="28" rx="14" fill="url(#accent)" opacity="0.15"/>
  <rect x="680" y="85" width="80" height="28" rx="14" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="720" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">v0.2.0</text>
