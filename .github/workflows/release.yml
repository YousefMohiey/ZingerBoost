name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zingerboost_bridge

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
      - working-directory: zingerboost_flutter
        run: |
          flutter create --platforms windows .
          flutter pub get
          flutter build windows

      - name: Collect release files
        run: |
          mkdir release
          copy target\release\zingerboost_core.dll release\
          copy zingerboost_flutter\build\windows\x64\runner\Release\zingerboost_flutter.exe release\
          copy zingerboost_flutter\build\windows\x64\runner\Release\flutter_windows.dll release\
          copy zingerboost_flutter\build\windows\x64\runner\Release\window_manager_plugin.dll release\
          copy zingerboost_flutter\build\windows\x64\runner\Release\screen_retriever_plugin.dll release\
          copy zingerboost_flutter\build\windows\x64\runner\Release\*.* release\

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - uses: softprops/action-gh-release@v2
        with:
          files: installer/ZingerBoost_Setup.exe
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            ## Download & Install
            1. Download `ZingerBoost_Setup.exe`
            2. Run the installer (includes all dependencies, one-click)
            3. Requires [VC++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe) if not already installed

            **25 Tweaks · 19 Services · 9 Cleaner Categories · 34 Debloat Targets**
            Built with Rust + Flutter. MIT License.
          fail_on_unmatched_files: false
