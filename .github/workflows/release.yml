name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zingerboost
      - run: |
          mkdir release
          copy target\release\zingerboost.exe release\
      - uses: softprops/action-gh-release@v2
        with:
          files: release/zingerboost.exe
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            ## ZingerBoost v0.5.0

            Pure Rust desktop server. Run `zingerboost.exe` and open http://127.0.0.1:19999 in your browser.

            **29 real tweaks** · **19 real services** · **9 real cleaner categories** · **34 real debloat targets**
          fail_on_unmatched_files: false
