name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zingerboost_bridge
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/zingerboost.exe
            target/release/zingerboost_core.dll
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            **Rust backend** — contains all 25 tweaks, services, cleaner, and debloat engine.

            **For the full GUI:** build Flutter locally on Windows:
            ```
            cd zingerboost_flutter
            flutter create --platforms windows .
            flutter pub get
            flutter build windows
            ```

            Requires [VC++ Redist](https://aka.ms/vs/17/release/vc_redist.x64.exe).
          fail_on_unmatched_files: false
