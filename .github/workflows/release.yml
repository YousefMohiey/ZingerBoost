name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
      - run: cargo build --release -p zingerboost_bridge
      - working-directory: zingerboost_flutter
        run: flutter pub get && flutter build windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/zingerboost_core.dll
            zingerboost_flutter/build/windows/x64/runner/Release/*.exe
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            Safe, open-source Windows optimizer. 25 tweaks, 34 bloatware removals, 30+ app installer — all reversible.

            Built with Rust + Flutter.
          fail_on_unmatched_files: false
