name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: cargo install tauri-cli --locked
      - run: cargo tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            Safe, open-source Windows optimizer. Apply tweaks, install software, remove bloatware — all reversible.

            **Includes:** 10 registry tweaks · 30+ apps via Winget · 21 bloatware removals · snapshot restore · audit logging

            Requires Windows 10/11. Built with Rust + Tauri.
          fail_on_unmatched_files: true
