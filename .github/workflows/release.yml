name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Rust backend
        run: cargo build --release -p zingerboost_bridge

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'

      - name: Build Flutter app
        working-directory: zingerboost_flutter
        run: |
          flutter create --platforms windows .
          flutter pub get
          flutter build windows

      - name: Package release
        shell: pwsh
        run: |
          $flutterBuild = "zingerboost_flutter\build\windows\x64\runner\Release"
          $releaseDir = "release\ZingerBoost"
          mkdir $releaseDir

          # Rust DLL
          copy target\release\zingerboost_core.dll $releaseDir\

          # Flutter output — EVERYTHING including data folder
          Copy-Item -Path "$flutterBuild\*" -Destination $releaseDir -Recurse

          # List for verification
          Get-ChildItem $releaseDir -Recurse

          # Create ZIP
          Compress-Archive -Path "$releaseDir\*" -DestinationPath release\ZingerBoost.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: release/ZingerBoost.zip
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            Extract `ZingerBoost.zip` to any folder and run `zingerboost.exe`.

            Requires [VC++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe) (one-time install).
          fail_on_unmatched_files: false
