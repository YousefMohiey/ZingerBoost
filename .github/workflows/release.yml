name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zingerboost_bridge

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
      - working-directory: zingerboost_flutter
        run: |
          flutter create --platforms windows .
          flutter pub get
          flutter build windows

      - name: Collect build output
        shell: cmd
        run: |
          mkdir release
          copy target\release\zingerboost_core.dll release\
          for /r zingerboost_flutter\build\windows %%f in (*.exe) do copy "%%f" release\
          for /r zingerboost_flutter\build\windows %%f in (*.dll) do copy "%%f" release\

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            Extract all files to a folder. Run `zingerboost.exe`.
            Requires [VC++ Redist](https://aka.ms/vs/17/release/vc_redist.x64.exe) (one-time).
          fail_on_unmatched_files: false
