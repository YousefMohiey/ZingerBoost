name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p zb_app
      - name: Package
        run: |
          mkdir release
          copy target\release\zb_app.exe release\zingerboost.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: release/zingerboost.exe
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            Run `zingerboost.exe` — pure Rust Iced desktop app.
            Requires [VC++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe) (one-time).
          fail_on_unmatched_files: false
