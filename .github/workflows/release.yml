name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zingerboost_bridge

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
      - working-directory: zingerboost_flutter
        run: |
          flutter create --platforms windows .
          flutter pub get
          flutter build windows

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/zingerboost_core.dll
            zingerboost_flutter/build/windows/x64/runner/Release/*.exe
            zingerboost_flutter/build/windows/x64/runner/Release/*.dll
          name: "ZingerBoost ${{ github.ref_name }}"
          body: "25 tweaks, 19 services, 9 cleaner categories, 34 debloat targets. Built with Rust + Flutter."
          fail_on_unmatched_files: false
