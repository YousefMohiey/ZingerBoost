name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zingerboost_bridge
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/zingerboost_core.dll
            target/release/zingerboost_core.lib
          name: "ZingerBoost ${{ github.ref_name }}"
          body: |
            Safe, open-source Windows optimizer. 25 tweaks, 19 services, 9 cleaner categories, 34 debloat targets — all reversible.

            Built with Rust + Flutter.
          fail_on_unmatched_files: false
